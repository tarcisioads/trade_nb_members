name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Code Formatting
        run: pnpm run format:check

      - name: Run ESLint Check
        run: pnpm run lint

      - name: Run Type Check
        run: pnpm run type-check

      - name: Run Tests
        run: pnpm run test:coverage

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            cd ~/trade_nb_members
            git pull origin main
            # Enable BuildKit for fast, cached parallel Docker builds
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            # Deploy using modern docker compose CLI (V2) or fallback to docker-compose
            if docker compose version >/dev/null 2>&1; then
              docker compose up -d --build
            else
              docker-compose up -d --build
            fi
            # Prune dangling images AFTER build to keep build cache intact
            docker image prune -f
